name: Build kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache || true
          df -h /

      - name: Fetch and verify the Arch Linux ARM root filesystem
        run: |
          # os.archlinuxarm.org serves a TLS certificate for another host name, so fetch over
          # HTTP and rely on the PGP signature below for integrity.
          base=http://os.archlinuxarm.org/os
          curl -fsSLO $base/ArchLinuxARM-aarch64-latest.tar.gz
          curl -fsSLO $base/ArchLinuxARM-aarch64-latest.tar.gz.sig
          gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys 68B3537F39A313B3E574D06777193F152BDBE6A6
          gpg --batch --status-fd 1 --verify ArchLinuxARM-aarch64-latest.tar.gz.sig ArchLinuxARM-aarch64-latest.tar.gz | tee verify.txt
          grep -q '^\[GNUPG:\] VALIDSIG 68B3537F39A313B3E574D06777193F152BDBE6A6 ' verify.txt
          sudo docker import ArchLinuxARM-aarch64-latest.tar.gz alarm
          rm ArchLinuxARM-aarch64-latest.tar.gz

      - name: Build
        run: |
          mkdir -p out
          sudo docker run --rm -v "$PWD":/work -v "$PWD/out":/out alarm /work/ci/build.sh

      - name: Checksums
        run: |
          cd out && ls -lh && cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-omarchy-slim7x
          path: out/
          retention-days: 14
